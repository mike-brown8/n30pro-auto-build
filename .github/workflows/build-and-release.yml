name: Build and Release N30Pro Firmware

on:
  push:
    paths:
      - '.upstream_tag'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get upstream tag
        id: get_tag
        run: |
          TAG=$(cat .upstream_tag | tr -d '[:space:]')
          if [ -z "$TAG" ]; then
            echo "::error::.upstream_tag is empty"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync subversion swig texinfo unzip wget zlib1g-dev libelf-dev \
            libbsd-dev xsltproc gcc-arm-linux-gnueabi binutils-arm-linux-gnueabi \
            jq

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth 1 -b ${{ steps.get_tag.outputs.tag }} \
            https://github.com/immortalwrt/immortalwrt.git openwrt
          cd openwrt
          echo "Cloned ImmortalWrt tag: ${{ steps.get_tag.outputs.tag }}"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject N30Pro DTS file
        run: |
          cp dts/mt7981b-netcore-n30pro.dts \
            openwrt/target/linux/mediatek/dts/
          echo "✅ Injected mt7981b-netcore-n30pro.dts"

      - name: Inject N30Pro device definition
        run: |
          cd openwrt
          FILE="target/linux/mediatek/image/filogic.mk"

          if grep -q "Device/netcore_n30pro" "$FILE"; then
            echo "::warning::netcore_n30pro already exists in filogic.mk, skipping injection"
          else
            awk '
              /^define Device\// && !done {
                print "# Netcore N30 Pro";
                print "define Device/netcore_n30pro";
                print "  DEVICE_VENDOR := Netcore";
                print "  DEVICE_MODEL := N30 Pro";
                print "  DEVICE_DTS := mt7981b-netcore-n30pro";
                print "  DEVICE_DTS_DIR := ../dts";
                print "  SUPPORTED_DEVICES += netcore,n30pro";
                print "  DEVICE_PACKAGES := kmod-mt7915-firmware kmod-mt7981-firmware \\";
                print "\tkmod-usb3 kmod-usb-xhci-mtk kmod-mt7531";
                print "  IMAGE/sysupgrade.bin := append-kernel | pad-to 128k | append-rootfs | \\";
                print "\tpad-rootfs | append-metadata";
                print "  IMAGE/initramfs.itb := append-kernel | pad-to 128k | append-rootfs | \\";
                print "\tpad-rootfs | append-metadata";
                print "endef";
                print "TARGET_DEVICES += netcore_n30pro";
                print "";
                done=1
              }
              { print }
            ' "$FILE" > "${FILE}.tmp"
            mv "${FILE}.tmp" "$FILE"
            echo "✅ Injected netcore_n30pro into filogic.mk"
            grep -A2 "Device/netcore_n30pro" "$FILE" | head -5
          fi

      - name: Configure build
        run: |
          cd openwrt
          cp "${{ github.workspace }}/defconfig/n30pro.config" .config
          make defconfig

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || {
            echo "::error::Parallel build failed, retrying with verbose output..."
            make -j1 V=s
          }
        timeout-minutes: 360

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find openwrt/bin/targets/mediatek/filogic/ -maxdepth 1 -type f \
            \( -name "*n30pro*.bin" -o -name "*n30pro*.itb" \) \
            -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0
        with:
          tag_name: n30pro-${{ steps.get_tag.outputs.tag }}
          name: "N30Pro Firmware (${{ steps.get_tag.outputs.tag }})"
          body: |
            基于 ImmortalWrt 上游 `${{ steps.get_tag.outputs.tag }}` 编译。

            ### 固件文件
            - `*n30pro*sysupgrade.bin`：系统升级固件
            - `*n30pro*initramfs.itb`：TFTP 恢复固件

            ---
            **⚠️ 免责声明：本固件由自动化流程构建，不保证安全性及稳定性。请自行评估风险后使用。**
          files: release-files/*
          draft: false
          prerelease: false